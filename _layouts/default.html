<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}PiggyBell</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root { color-scheme: light dark; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0 auto; max-width: 720px; padding: 24px 20px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 17px; line-height: 1.75; word-break: keep-all; overflow-wrap: break-word;
      color: #222; background: #fff;
    }
    h1 { font-size: 1.5em; line-height: 1.4; margin: 0.4em 0 0.8em; }
    h2 { font-size: 1.25em; line-height: 1.4; margin: 2em 0 0.6em; padding-top: 0.6em; border-top: 1px solid #e5e5e5; }
    h3 { font-size: 1.08em; margin: 1.6em 0 0.4em; }
    p, ul, ol { margin: 0 0 1em; }
    ul, ol { padding-left: 1.4em; }
    li { margin: 0.25em 0; }
    a { color: #c4524d; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 0.94em; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    footer { margin-top: 3em; padding-top: 1em; border-top: 1px solid #e5e5e5; font-size: 0.9em; color: #666; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #161616; }
      h2, footer { border-color: #333; }
      th, td { border-color: #444; }
      a { color: #fc8b87; }
      footer { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
  {% unless page.hide_footer %}
  <footer><a href="{{ '/' | relative_url }}">PiggyBell 법적 고지</a> · 문의 <a href="mailto:blue6044@naver.com">blue6044@naver.com</a></footer>
  {% endunless %}
</body>
</html>
